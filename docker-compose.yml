services:
  # ── API ────────────────────────────────────────────────────
  orders-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-ordersdb};Username=${POSTGRES_USER:-orders};Password=${POSTGRES_PASSWORD:-orders_secret}
      - BlobStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orders-net
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: orders-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ordersdb}
      - POSTGRES_USER=${POSTGRES_USER:-orders}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-orders_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders} -d ${POSTGRES_DB:-ordersdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orders-net
    restart: unless-stopped

  # ── Azurite (mock Azure Blob Storage) ──────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: orders-azurite
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - azurite-data:/data
    networks:
      - orders-net
    restart: unless-stopped

volumes:
  pgdata:
  azurite-data:

networks:
  orders-net:
    driver: bridge
