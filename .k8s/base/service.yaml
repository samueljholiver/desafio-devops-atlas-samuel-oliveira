apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/component: api
spec:
  # ClusterIP — o tráfego externo chega via Ingress, não direto no Service.
  # Isso mantém o Service interno ao cluster e delega TLS/roteamento ao Ingress Controller.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
